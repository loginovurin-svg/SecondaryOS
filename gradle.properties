org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Увеличиваем максимальный размер кучи (heap) для Gradle до 2 ГБ.
# Это критически необходимо для успешного сжатия (compress) больших файлов assets 
# (debian-rootfs.tar.gz ~28 МБ и qemu-aarch64 ~13 МБ) без ошибки "Java heap space".
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Включаем кэширование и параллельную сборку для ускорения процесса в GitHub Actions
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false
