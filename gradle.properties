# КРИТИЧЕСКИ ВАЖНО: Выделяем 2 ГБ оперативной памяти для Gradle.
# Без этого сборка падает с "Java heap space" при попытке упаковать большие assets.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Оптимизация для GitHub Actions
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# Включаем поддержку AndroidX (обязательно для современных библиотек)
android.useAndroidX=true
android.enableJetifier=true
