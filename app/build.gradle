plugins {
    id 'com.android.application'
}

android {
    namespace 'com.secondaryos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.secondaryos.app"
        minSdk 26
        targetSdk 34
        versionCode 4  // ← УВЕЛИЧЕНО ДО 3
        versionName "0.1.3"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // ЯВНО УКАЗЫВАЕМ ПУТЬ К НАТИВНЫМ БИБЛИОТЕКАМ
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    // ЯВНО УКАЗЫВАЕМ, ЧТО .so ФАЙЛЫ НЕЛЬЗЯ СЖИМАТЬ
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    aaptOptions {
        noCompress "tar.gz", "gz", "tar", "sh", "so"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
