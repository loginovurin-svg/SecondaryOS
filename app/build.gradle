plugins {
    id 'com.android.application'
}

android {
    namespace 'com.secondaryos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.secondaryos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // Только arm64 — целевое устройство Galaxy A15 (Helio G99)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // ВАЖНО: заставляет Android распаковывать .so из jniLibs на диск
    // в nativeLibraryDir. Без этого libproot.so нельзя будет выполнить.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Распаковка tar.xz внутри приложения
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
}
