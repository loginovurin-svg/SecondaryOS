plugins {
    id 'com.android.application'
}

android {
    namespace 'com.secondaryos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.secondaryos.app"
        minSdk 26
        // ВАЖНО: 28, как у Termux.
        // Android 10+ запрещает выполнять файлы из папки files/
        // приложения, если targetSdk >= 29. Со значением 28
        // SELinux разрешает exec, и контейнер сможет запускать bash.
        targetSdk 28
        versionCode 2
        versionName "0.2"

        // Только arm64 — целевое устройство Galaxy A15 (Helio G99)
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Заставляет Android распаковывать .so из jniLibs на диск
    // в nativeLibraryDir — иначе libproot.so нельзя выполнить
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Распаковка tar.xz внутри приложения
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
}
