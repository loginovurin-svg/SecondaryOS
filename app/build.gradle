plugins {
    id 'com.android.application'
}

android {
    namespace 'com.secondaryos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.secondaryos.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        // Запрещаем сжатие файлов, которые уже сжаты.
        // Это предотвращает их выпадение из APK и ошибки упаковки.
        noCompress 'tar.gz', 'xz', 'tar', 'gz'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
